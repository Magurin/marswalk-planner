[package]
name = "marswalk-tiles"
version = "0.1.0"
edition = "2024"
description = "Caching tile proxy for NASA Mars Trek WMTS tiles"

[dependencies]
axum = "0.8"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net", "time", "sync"] }

[profile.release]
opt-level = 3
